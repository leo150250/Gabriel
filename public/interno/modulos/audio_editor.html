<dialog id="dialogoAudioEditor">
	<h1>Editor de áudio de instrumento</h1>
	<h2 id="instrumentoEditorNome">...</h2>
	<div class="scroll" style="height: 10rem">
		<table id="listaCamadasEditorAudio">
			<tr class="sticky">
				<th>ID</th>
				<th>Mult.</th>
				<th>Ganho</th>
				<th></th>
			</tr>
			<tr>
				<td>Corpo</td>
				<td>1</td>
				<td>0.8</td>
				<td><button>🗑️</button></td>
			</tr>
			<tr>
				<td>1</td>
				<td>Brilho</td>
			</tr>
		</table>
	</div>
	<div>
		<span class="form">
			<span class="form"><label>ID:</label><input disabled type="text" id="dialogEditorAudio_CamadaID"></span>
			<span class="form"><label>Multiplicador:</label><input disabled type="number" min="0.1" max="5.0" id="dialogEditorAudio_CamadaMult"></span>
			<span class="form"><label>Ganho:</label><input disabled type="number" min="0.00" max="1.00" id="dialogEditorAudio_CamadaGanho"></span>
		</span>
		<span class="form">
			<span class="form"><label>ATK:</label><input disabled type="number" min="0" max="1" id="dialogEditorAudio_EnvATK"></span>
			<span class="form"><label>DEC:</label><input disabled type="number" min="0" max="1" id="dialogEditorAudio_EnvDEC"></span>
			<span class="form"><label>SUS:</label><input disabled type="number" min="0" max="1" id="dialogEditorAudio_EnvSUS"></span>
			<span class="form"><label>REL:</label><input disabled type="number" min="0" max="1" id="dialogEditorAudio_EnvREL"></span>
		</span>
		<span class="form">
			<canvas id="dialogEditorAudio_Env"></canvas>
		</span>
		<table id="listaFramesCamada">
			<tr class="sticky" id="">
				<th>Frame</th>
				<th>0</th>
			</tr>
			<tr>
				<td>Ataque</td>
				<td>0</td>
			</tr>
		</table>
	</div>
	<div class="botoes">
		<button type="button" title="Descartar alterações e retornar" onclick="fecharDialogo('dialogoAudioEditor')">Cancelar</button>
		<div class="espacador"></div>
	</div>
</dialog>
