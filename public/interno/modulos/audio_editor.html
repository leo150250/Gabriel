<dialog id="dialogoAudioEditor">
	<h1>Editor de áudio de instrumento</h1>
	<span class="form">
		<h2 id="instrumentoEditorNome">...</h2>
		<button onclick="executarSomCamadasEdit()">▶️</button>
		<button onclick="alternarExecucaoLoopCamadasEdit()">🔁</button>
	</span>
	<div class="scroll" style="height: 10rem">
		<table id="listaCamadasEditorAudio">
			<tr class="sticky">
				<th></th>
				<th>ID</th>
				<th>Mult.</th>
				<th>Ganho</th>
				<th></th>
			</tr>
		</table>
	</div>
	<div>
		<span class="form">
			<span class="form"><label>ID:</label><input disabled type="text" id="dialogEditorAudio_CamadaID"></span>
			<span class="form"><label>Multiplicador:</label><input disabled type="number" min="0.1" max="5.0" id="dialogEditorAudio_CamadaMult"></span>
			<span class="form"><label>Ganho:</label><input disabled type="number" min="0.00" max="1.00" id="dialogEditorAudio_CamadaGanho"></span>
		</span>
		<span class="form">
			<label><input disabled type="checkbox" id="dialogEditorAudio_CamadaVibrato"> Vibrato</label>
			<span class="form"><label>Frequência:</label><input disabled type="number" min="0" step="0.1" id="dialogEditorAudio_CamadaVibratoFrequencia"></span>
			<span class="form"><label>Profundidade (cents):</label><input disabled type="number" min="0" max="100" step="0.1" id="dialogEditorAudio_CamadaVibratoProfundidade"></span>
			<span class="form"><label>Atraso (s):</label><input disabled type="number" min="0" max="1" step="0.1" id="dialogEditorAudio_CamadaVibratoAtraso"></span>
		</span>
		<span class="form">
			<span class="form"><label>ATK:</label><input disabled type="number" min="0" max="1" step="0.001" id="dialogEditorAudio_EnvATK"></span>
			<span class="form"><label>DEC:</label><input disabled type="number" min="0" max="1" step="0.001" id="dialogEditorAudio_EnvDEC"></span>
			<span class="form"><label>SUS:</label><input disabled type="number" min="0" max="1" step="0.001" id="dialogEditorAudio_EnvSUS"></span>
			<span class="form"><label>REL:</label><input disabled type="number" min="0" max="1" step="0.001" id="dialogEditorAudio_EnvREL"></span>
		</span>
		<span class="form">
			<canvas id="dialogEditorAudio_Env" width="auto"></canvas>
		</span>
	</div>
	<div class="scroll">
		<table id="listaFramesCamada">
			<tr class="sticky" id="">
				<th>Frame</th>
				<th>0</th>
				<th>1</th>
				<th><button>➕</button></th>
			</tr>
			<tr>
				<td>Ataque</td>
				<td>0</td>
				<td>1</td>
				<td></td>
			</tr>
		</table>
	</div>
	<div class="botoes">
		<button type="button" title="Descartar alterações e retornar" onclick="fecharDialogo('dialogoAudioEditor')">Cancelar</button>
		<div class="espacador"></div>
	</div>
</dialog>
